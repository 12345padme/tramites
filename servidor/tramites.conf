# ==========================================================================
# Virtual Host de Apache para "Seguimiento de trámites"
# --------------------------------------------------------------------------
# Servidor:  Apache 2.4 (XAMPP para Windows)
# Ubicación: copiar este bloque al final de
#            C:\xampp\apache\conf\extra\httpd-vhosts.conf
# Resultado: la aplicación responde en  http://localhost/tramites
# ==========================================================================

# --- Puerto ---------------------------------------------------------------
# Apache escucha en el puerto 80 (HTTP). La directiva "Listen 80" ya viene
# en C:\xampp\apache\conf\httpd.conf, por eso aquí no se repite.
# El "*:80" del Virtual Host indica: atiende las peticiones que lleguen
# por el puerto 80 desde cualquier interfaz de red del equipo.

<VirtualHost *:80>

    # Nombre con el que se identifica este sitio.
    ServerName localhost

    # Carpeta raíz del servidor: lo que se ve en http://localhost/
    DocumentRoot "C:/xampp/htdocs"

    # --- Mapeo de directorios ---------------------------------------------
    # La ruta web /tramites se sirve desde una carpeta fuera de htdocs:
    #   http://localhost/tramites  →  C:\sitios\tramites
    # En esa carpeta se descomprime el paquete tramites-v1.0.0.zip.
    Alias /tramites "C:/sitios/tramites"

    <Directory "C:/sitios/tramites">
        # No listar el contenido de carpetas que no tengan index.html.
        Options -Indexes
        # No se usan archivos .htaccess en esta aplicación.
        AllowOverride None
        # Permitir el acceso a esta carpeta (Apache lo niega por defecto
        # en carpetas que están fuera de htdocs).
        Require all granted
        # Archivo que se entrega al abrir la ruta /tramites
        DirectoryIndex index.html
    </Directory>

    # Bitácoras propias de la aplicación (dentro de C:\xampp\apache\logs).
    ErrorLog "logs/tramites-error.log"
    CustomLog "logs/tramites-access.log" common

</VirtualHost>
